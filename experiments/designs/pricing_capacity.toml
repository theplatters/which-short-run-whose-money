financing = "F1"
eta = 1.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
delta = 0.0
note = "P1 capacity door, delta = 0, the nesting canary (reproduces matrix_5x3-GAMMA-F1); fixed nominal wage, compositional F1 shift"

